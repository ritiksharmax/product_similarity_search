apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: product-similarity
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: product-similarity}
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: product-similarity
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: product-similarity}
