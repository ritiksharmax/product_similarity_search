apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-similarity
  labels: {app.kubernetes.io/name: product-similarity}
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app.kubernetes.io/name: product-similarity}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}   # zero-downtime rollouts
  template:
    metadata:
      labels: {app.kubernetes.io/name: product-similarity}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: product-similarity:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - configMapRef: {name: product-similarity-config}
          resources:
            # Measured RSS with the MiniLM index (30k x 755-d): 606 MiB. Vectors are held 3x
            # (unweighted blocks for /explain, weighted, FAISS copy) plus pandas/sklearn.
            requests: {cpu: 250m, memory: 768Mi}
            limits: {cpu: "1", memory: 1280Mi}
          startupProbe:          # allows for an in-memory HNSW rebuild if weights changed
            httpGet: {path: /readyz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
